<div class="wizard-step-content">
	<!-- #region Header -->
	<div class="section-header">
		<h3><i class="pi pi-link"></i> Endpoints</h3>
		<div class="endpoint-actions">
			<edu-button
				label="Cargar Presets"
				icon="pi pi-download"
				[outlined]="true"
				size="small"
				(click)="onLoadPresets()"
				eduTooltip="Cargar endpoints predefinidos del proyecto (usuarios, cursos, asistencias, etc.)"
				eduTooltipPosition="top"
			/>
			<edu-button
				label="Agregar"
				icon="pi pi-plus"
				size="small"
				(click)="onAddEndpoint()"
				eduTooltip="Agregar un endpoint personalizado"
				eduTooltipPosition="top"
			/>
		</div>
	</div>
	<!-- #endregion -->

	@if (vm().endpoints.length > 0) {
		<!-- #region Toggle All -->
		<div class="toggle-all">
			<edu-button
				label="Todos"
				icon="pi pi-check-square"
				[text]="true"
				size="small"
				(click)="onToggleAllEndpoints(true)"
			/>
			<edu-button
				label="Ninguno"
				icon="pi pi-stop"
				[text]="true"
				size="small"
				(click)="onToggleAllEndpoints(false)"
			/>
		</div>
		<!-- #endregion -->

		<!-- #region Endpoints List -->
		<div
			class="endpoints-list"
			cdkDropList
			(cdkDropListDropped)="onDropEndpoint($event)"
		>
			@for (ep of vm().endpoints; track $index; let i = $index) {
				<div class="endpoint-card" [class.disabled]="!ep.enabled" cdkDrag>
					<div class="endpoint-header">
						<i class="pi pi-bars drag-handle" cdkDragHandle></i>
						<edu-checkbox
							[ngModel]="ep.enabled"
							(ngModelChange)="onToggleEndpoint(i)"
							[binary]="true"
							[inputId]="'ep-' + i"
						/>

						<edu-select
							[options]="httpMethodOptions"
							optionLabel="label"
							optionValue="value"
							[ngModel]="ep.method"
							(ngModelChange)="onEndpointMethodChange(i, $event)"
							appendTo="body"
						/>

						<input
							type="text"
							eduInputText
							placeholder="/api/usuarios"
							[ngModel]="ep.path"
							(ngModelChange)="onEndpointPathChange(i, $event)"
							class="endpoint-path-input"
						/>

						<input
							type="text"
							eduInputText
							placeholder="nombre-check"
							[ngModel]="ep.name"
							(ngModelChange)="onEndpointNameChange(i, $event)"
							class="endpoint-name-input"
							eduTooltip="Nombre para identificar este endpoint en los checks de k6"
							eduTooltipPosition="top"
						/>

						<edu-button
							icon="pi pi-trash"
							[text]="true"
							[rounded]="true"
							size="small"
							severity="danger"
							(click)="onRemoveEndpoint(i)"
							[pt]="{ root: { 'aria-label': 'Eliminar endpoint' } }"
						/>
					</div>

					@if (showBody(ep)) {
						<div class="endpoint-body">
							<textarea
								eduTextarea
								placeholder='{ "campo": "valor" }'
								[ngModel]="ep.body"
								(ngModelChange)="onEndpointBodyChange(i, $event)"
								[rows]="2"
								[autoResize]="true"
								class="body-textarea"
							></textarea>
						</div>
					}
				</div>
			}
		</div>
		<!-- #endregion -->
	} @else {
		<!-- #region Empty State -->
		<div class="empty-endpoints">
			<i class="pi pi-link" style="font-size: 2rem"></i>
			<p>Sin endpoints configurados</p>
			<span
				>Carga los presets del proyecto o agrega endpoints manualmente</span
			>
		</div>
		<!-- #endregion -->
	}

	<!-- #region Footer -->
	<div class="step-footer">
		<edu-button
			label="Anterior"
			icon="pi pi-arrow-left"
			[outlined]="true"
			(click)="onGoPrev()"
		/>
		<div class="step-spacer"></div>
		<edu-button
			label="Siguiente"
			icon="pi pi-arrow-right"
			iconPos="right"
			(click)="onGoNext()"
		/>
	</div>
	<!-- #endregion -->
</div>

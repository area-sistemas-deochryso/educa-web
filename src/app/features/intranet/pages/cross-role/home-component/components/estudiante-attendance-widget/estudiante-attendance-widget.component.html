<!-- #region Template -->
<div class="widget-card">
	<div class="widget-header">
		<div class="widget-title">
			<i class="pi pi-user-check"></i>
			<h3>Mi Asistencia</h3>
		</div>
		<a routerLink="/intranet/asistencia" class="widget-link" data-info-anchor="home-estudiante-asistencia-ver-detalle"
			>Ver detalle <i class="pi pi-arrow-right"></i
		></a>
	</div>

	@if (loading()) {
		<div class="widget-skeleton">
			<app-skeleton-loader variant="rect" width="30%" height="16px" />
			<app-skeleton-loader variant="rect" width="100%" height="56px" />
		</div>
	} @else if (hasDataHoy()) {
		<div class="mi-asistencia-row">
			<span class="curso-label">{{ cursoNombre() }}</span>
			<span class="estado-badge" [class]="estadoSeverityClass()">{{ estadoLabel() }}</span>
		</div>
	} @else {
		<div class="widget-empty">
			<i class="pi pi-info-circle"></i>
			<span>Sin datos de asistencia para hoy</span>
		</div>
	}
</div>
<!-- #endregion -->

<!-- #region Template -->
<div class="calendar-container">
	<!-- * Title, year arrows, today and month pills -->
	<app-calendar-header
		[currentYear]="currentYear()"
		[currentMonth]="currentMonth()"
		[monthCounts]="monthCounts()"
		(goToToday)="onGoToToday()"
		(goToYear)="onGoToYear($event)"
		(goToMonth)="onGoToMonth($event)"
	/>

	<app-calendar-legend />

	<div class="layout">
		<!-- * Big month with event titles inside each day -->
		<section class="month-panel" aria-labelledby="month-title">
			<div class="month-bar">
				<button type="button" class="step-btn" aria-label="Mes anterior" (click)="onStepMonth(-1)">
					<i class="pi pi-chevron-left" aria-hidden="true"></i>
				</button>
				<h2 id="month-title">{{ monthTitle() }}</h2>
				<button type="button" class="step-btn" aria-label="Mes siguiente" (click)="onStepMonth(1)">
					<i class="pi pi-chevron-right" aria-hidden="true"></i>
				</button>
			</div>

			@if (monthData(); as month) {
				<app-calendar-month-view
					[month]="month"
					[entries]="entries()"
					[selectedKey]="selectedKey()"
					(entrySelect)="onEntrySelect($event)"
					(daySelect)="onDaySelect($event)"
				/>
			}
		</section>

		<!-- * Month (or selected day) agenda -->
		<app-calendar-agenda
			[heading]="agendaHeading()"
			[entries]="agendaEntries()"
			[canClear]="selectedKey() !== null"
			(entrySelect)="onEntrySelect($event)"
			(clearSelection)="onClearSelection()"
		/>
	</div>
</div>

<!-- * Modal for holiday/event details -->
<app-calendar-day-modal [visible]="showModal()" [data]="modalData()" (closeModal)="onCloseModal()" />
<!-- #endregion -->

<!-- #region Main layout -->
<app-page-header
	icon="pi pi-wrench"
	title="Herramientas de prueba"
	subtitle="Solo disponible en desarrollo"
/>

<section class="test-tools-section">
	<h2>Simulación de asistencia CrossChex</h2>
	<p class="test-tools-section__hint">
		Dispara una marcación simulada (sin CrossChex real) para una persona de prueba y
		verificá el correo de confirmación en la bandeja de correos.
	</p>
	<app-crosschex-trigger-form />
	<edu-button
		label="Ver bandeja de correos"
		icon="pi pi-envelope"
		[text]="true"
		(click)="onGoToEmailOutbox()"
	/>
</section>
<!-- #endregion -->

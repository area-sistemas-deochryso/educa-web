<edu-dialog
	[visible]="visible()"
	(visibleChange)="visibleChange.emit($event)"
	[modal]="true"
	[dismissableMask]="true"
	[style]="{ width: '38rem' }"
	[header]="wizard()?.titulo ?? 'Guía paso a paso'"
	(onHide)="onHide()"
>
	@if (wizard(); as w) {
		<edu-stepper [value]="activeStep()" (valueChange)="goToStep(+$event)">
			<edu-step-list>
				@for (paso of w.pasos; track paso.orden; let i = $index) {
					<edu-step [value]="i">Paso {{ i + 1 }}</edu-step>
				}
			</edu-step-list>

			<edu-step-panels>
				@for (paso of w.pasos; track paso.orden; let i = $index) {
					<edu-step-panel [value]="i">
						<ng-template #content>
							<div class="wizard-step">
								@if (paso.imagenUrl) {
									<img [src]="paso.imagenUrl" alt="" class="wizard-step__image" />
								}
								<p class="wizard-step__text">{{ paso.texto }}</p>
							</div>
						</ng-template>
					</edu-step-panel>
				}
			</edu-step-panels>
		</edu-stepper>

		<div class="wizard-actions">
			<edu-button
				label="Anterior"
				icon="pi pi-arrow-left"
				severity="secondary"
				[outlined]="true"
				[disabled]="activeStep() === 0"
				(click)="goToStep(activeStep() - 1)"
			/>
			@if (!isLastStep()) {
				<edu-button
					label="Siguiente"
					icon="pi pi-arrow-right"
					iconPos="right"
					(click)="goToStep(activeStep() + 1)"
				/>
			} @else {
				<edu-button label="Listo" icon="pi pi-check" (click)="onHide()" />
			}
		</div>
	}
</edu-dialog>

@for (grupo of faqsPorCategoria(); track grupo.categoria) {
	<section class="faq-categoria">
		<div class="faq-categoria__header">
			<i [class]="categoriaIconMap[grupo.categoria] || 'pi pi-users'" class="faq-categoria__icon" aria-hidden="true"></i>
			<h4 class="faq-categoria__titulo">{{ grupo.categoria }}</h4>
			<span class="faq-categoria__badge">{{ grupo.faqs.length }}</span>
		</div>
		<ul class="faq-categoria__items">
			@for (faq of grupo.faqs; track faq.id) {
				<li>
					<button
						type="button"
						class="faq-item"
						[class.faq-item--on]="faq.id === selectedId()"
						[attr.aria-current]="faq.id === selectedId() ? 'true' : null"
						(click)="faqSelected.emit(faq.id)"
					>
						<span class="faq-item__pregunta">
							@for (seg of segments(faq.pregunta); track $index) {
								@if (seg.match) {
									<mark class="faq-item__mark">{{ seg.text }}</mark>
								} @else {
									{{ seg.text }}
								}
							}
						</span>
						@if (faq.wizard) {
							<span class="faq-item__guia" title="Incluye guía paso a paso">
								<i class="pi pi-list" aria-hidden="true"></i>
								{{ faq.wizard.pasos.length }} pasos
							</span>
						}
					</button>
				</li>
			}
		</ul>
	</section>
}

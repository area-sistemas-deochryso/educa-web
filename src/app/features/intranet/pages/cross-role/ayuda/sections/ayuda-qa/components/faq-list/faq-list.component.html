<edu-accordion [multiple]="true">
	@for (faq of faqs(); track faq.id) {
		<edu-accordion-panel [value]="faq.id.toString()">
			<edu-accordion-header>
				<span class="faq-question">{{ faq.pregunta }}</span>
				@if (faq.categoria) {
					<span class="faq-category">{{ faq.categoria }}</span>
				}
				@if (faq.wizard) {
					<edu-button
						label="Ver guía paso a paso"
						icon="pi pi-arrow-right"
						iconPos="right"
						size="small"
						(click)="onOpenWizard(faq, $event)"
					/>
				}
			</edu-accordion-header>

				<p class="faq-answer">{{ faq.respuesta }}</p>

		</edu-accordion-panel>
	}
</edu-accordion>

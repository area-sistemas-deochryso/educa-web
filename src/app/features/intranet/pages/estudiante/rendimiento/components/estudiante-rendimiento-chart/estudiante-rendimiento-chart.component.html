<div class="chart-canvas-wrap">
	<canvas #rendimientoChart [class.chart-canvas--hidden]="periodos().length === 0"></canvas>
	@if (periodos().length === 0) {
		<div class="chart-empty">
			<i class="pi pi-chart-line" aria-hidden="true"></i>
			@if (sinPeriodosConfigurados()) {
				<span>Este curso aún no tiene los períodos de evaluación configurados</span>
			} @else {
				<span>Sin datos para este período</span>
			}
		</div>
	}
</div>

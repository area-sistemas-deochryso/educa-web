<app-page-header
	icon="pi pi-inbox"
	title="Tickets de soporte"
	subtitle="Bandeja de tickets recibidos y catálogo de tipos de problema"
/>

<edu-tabs [value]="activeTab()" (valueChange)="onTabChange($event)" data-info-anchor="admin-tickets-tabs">

		@for (tab of tabs; track tab.value) {
			<edu-tab [value]="tab.value">
				<i [class]="tab.icon + ' mr-2'"></i>
				{{ tab.label }}
			</edu-tab>
		}

</edu-tabs>

<router-outlet />

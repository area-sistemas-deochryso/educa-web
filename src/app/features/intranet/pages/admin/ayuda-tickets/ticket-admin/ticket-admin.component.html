@if (!canAccess) {
	<div class="empty-state">
		<i class="pi pi-lock text-3xl mb-2"></i>
		<p>No tenés permiso para acceder a la administración de tickets.</p>
	</div>
} @else {
	<app-page-header
		icon="pi pi-inbox"
		title="Tickets de soporte"
		subtitle="Bandeja de tickets recibidos y catálogo de tipos de problema"
	/>

	<edu-tabs [value]="activeTab()" (valueChange)="onTabChange($event)" data-info-anchor="admin-tickets-tabs">
		
			<edu-tab value="bandeja">
				<i class="pi pi-inbox mr-2"></i>
				Bandeja
			</edu-tab>
			<edu-tab value="tipos">
				<i class="pi pi-tags mr-2"></i>
				Tipos de ticket
			</edu-tab>
		
	</edu-tabs>

	@if (activeTab() === 'bandeja') {
		<app-ticket-bandeja />
	} @else {
		<app-ticket-tipos />
	}
}

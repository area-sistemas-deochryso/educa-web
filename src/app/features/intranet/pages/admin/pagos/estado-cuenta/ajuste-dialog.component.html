<edu-dialog
	[visible]="visible()"
	(visibleChange)="onVisibleChange($event)"
	[modal]="true"
	[draggable]="false"
	[resizable]="false"
	[closable]="!guardando()"
	header="Registrar ajuste"
	[style]="{ width: '480px' }"
	appendTo="body"
>
	@if (contexto(); as ctx) {
		<div class="flex flex-col gap-3">
			<p class="m-0">
				Cargo: <strong>{{ ctx.cargo }}</strong>
				<br />
				<small>Se puede ajustar hasta {{ soles(ctx.tope) }} (sin contar el recargo). El servidor confirma el tope al guardar.</small>
			</p>
			<label class="flex flex-col gap-1">
				<span>Tipo</span>
				<edu-select [options]="tipos" [ngModel]="tipo()" (ngModelChange)="tipo.set($event)" optionLabel="label" optionValue="value" />
			</label>
			<label class="flex flex-col gap-1">
				<span>Monto (S/) <span aria-hidden="true">*</span></span>
				<edu-input-number
					[ngModel]="monto()"
					(ngModelChange)="monto.set($event)"
					placeholder="0.00"
					[min]="0"
					[minFractionDigits]="2"
					[maxFractionDigits]="2"
					[showButtons]="false"
				/>
			</label>
			<label class="flex flex-col gap-1">
				<span>Motivo @if (motivoObligatorio()) {<span aria-hidden="true">*</span>} @else {(opcional)}</span>
				<textarea
					eduTextarea
					rows="3"
					maxlength="500"
					[ngModel]="motivo()"
					(ngModelChange)="motivo.set($event)"
					placeholder="Por qué se aplica este ajuste"
					class="w-full"
				></textarea>
			</label>
			@if (error(); as mensaje) {
				<edu-message severity="danger" [text]="mensaje" />
			}
			<div class="flex justify-end gap-2">
				<edu-button label="Cancelar" severity="secondary" [text]="true" [disabled]="guardando()" (click)="onVisibleChange(false)" />
				<edu-button label="Registrar ajuste" icon="pi pi-check" [loading]="guardando()" [disabled]="!puedeGuardar()" (click)="aceptar()" />
			</div>
		</div>
	}
</edu-dialog>

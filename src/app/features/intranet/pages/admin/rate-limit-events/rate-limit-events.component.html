@if (hubFiltered()) {
	<app-hub-context-banner
		level="warn"
		[message]="hubFilterMessage()"
		(clearFilter)="clearHubFilter()"
	/>
}

<!-- #region Header -->
<app-page-header
	icon="pi pi-shield"
	title="Telemetría de Rate Limiting"
	subtitle="Observabilidad de respuestas 429 y consumo de tokens por policy"
>
	<edu-button
		type="button"
		icon="pi pi-file-export"
		label="Exportar CSV"
		[outlined]="true"
		size="small"
		data-info-anchor="admin-rate-limit-export-csv-btn"
		(click)="onExportCsv()"
		[pt]="{ root: { 'aria-label': 'Exportar eventos a CSV' } }"
	/>
	<edu-button
		icon="pi pi-refresh"
		[text]="true"
		size="small"
		data-info-anchor="admin-rate-limit-refresh-btn"
		(click)="onRefresh()"
		[loading]="vm().loading || vm().loadingStats"
		[pt]="{ root: { 'aria-label': 'Refrescar' } }"
	/>
</app-page-header>
<!-- #endregion -->

<!-- #region Stats -->
<app-rate-limit-stats
	[stats]="vm().stats"
	[loading]="vm().loadingStats"
/>
<!-- #endregion -->

<!-- #region Filtros -->
<app-rate-limit-filters
	[filter]="vm().filter"
	(filterChange)="onFilterChange($event)"
	(clearFilters)="onClearFilters()"
/>
<!-- #endregion -->

<!-- #region Error inline -->
@if (vm().error) {
	<div class="error-banner">
		<i class="pi pi-exclamation-triangle"></i>
		<span>{{ vm().error }}</span>
	</div>
}
<!-- #endregion -->

<!-- #region Tabla -->
@if (vm().tableReady) {
	<section class="table-section">
		<app-rate-limit-table
			[items]="vm().items"
			[loading]="vm().loading"
			[total]="vm().total"
			[page]="vm().page"
			[pageSize]="vm().pageSize"
			(rowSelected)="onRowSelected($event)"
			(lazyLoad)="onLazyLoad($event)"
		/>
	</section>
} @else {
	<app-table-skeleton [columns]="tableSkeletonColumns" [rows]="10" />
}
<!-- #endregion -->

<!-- #region Drawer -->
<app-rate-limit-detail-drawer
	[visible]="vm().drawerVisible"
	[item]="vm().selectedItem"
	(visibleChange)="onDrawerVisibleChange($event)"
/>
<!-- #endregion -->

<!-- #region Toast (para copy-to-clipboard) -->
<edu-toast />
<!-- #endregion -->

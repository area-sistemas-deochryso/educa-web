<!-- * Header -->
<app-page-header
	icon="pi pi-clock"
	[title]="vm().isAdmin ? 'Gestión de Horarios' : 'Mis Horarios'"
	[subtitle]="vm().isAdmin ? 'Administra los horarios de clases por salón' : 'Consulta tus horarios de clases asignados'"
>
	<app-period-toggle
		[value]="vm().esVerano"
		(valueChange)="onPeriodoChange($event)"
	/>
	<button
		pButton
		label="Refrescar"
		icon="pi pi-refresh"
		class="p-button-outlined"
		data-info-anchor="admin-schedules-refresh-btn"
		(click)="refresh()"
		[loading]="vm().loading"
		eduTooltip="Actualizar lista de horarios"
		eduTooltipPosition="bottom"
		[pt]="{ root: { 'aria-label': 'Refrescar horarios' } }"
	></button>

	@if (vm().isAdmin) {
		<button
			pButton
			label="Importar"
			icon="pi pi-upload"
			class="p-button-outlined"
			data-info-anchor="admin-schedules-importar-btn"
			(click)="onOpenImportDialog()"
			eduTooltip="Importar horarios desde Excel"
			eduTooltipPosition="bottom"
			[pt]="{ root: { 'aria-label': 'Importar horarios desde Excel' } }"
		></button>
		<button
			pButton
			label="Nuevo Horario"
			icon="pi pi-plus"
			class="p-button-success"
			data-info-anchor="admin-schedules-nuevo-btn"
			(click)="onNew()"
			eduTooltip="Crear un nuevo horario de clase"
			eduTooltipPosition="bottom"
			[pt]="{ root: { 'aria-label': 'Crear nuevo horario' } }"
		></button>
	}
</app-page-header>

@if (vm().error) {
	<div class="error-banner">
		<i class="pi pi-exclamation-triangle"></i>
		<span>{{ vm().error }}</span>
	</div>
}

@if (vm().isAdmin && !vm().optionsLoading) {
	<app-dependency-guidance [checks]="dependencyChecks()" />
}

<!-- * Estadisticas -->
@if (vm().statsReady) {
	<app-kpi-stats [items]="statsItems()" />
} @else {
	<app-schedules-stats-skeleton />
}

<!-- #region View tabs + estado filter -->
<div class="view-toolbar">
	<div class="view-tabs">
		<button
			pButton
			label="Por Salón"
			icon="pi pi-building"
			class="p-button-text tab-button"
			[class.active]="vm().vistaActual === 'salon'"
			data-info-anchor="tab-switch"
			(click)="onCambiarVista('salon')"
			eduTooltip="Ver horarios agrupados por salón"
			eduTooltipPosition="top"
		></button>
		<button
			pButton
			label="Por Profesor"
			icon="pi pi-user"
			class="p-button-text tab-button"
			[class.active]="vm().vistaActual === 'profesor'"
			data-info-anchor="tab-switch"
			(click)="onCambiarVista('profesor')"
			eduTooltip="Ver horarios agrupados por profesor"
			eduTooltipPosition="top"
		></button>
		<button
			pButton
			label="Vista Global"
			icon="pi pi-exclamation-triangle"
			class="p-button-text tab-button"
			[class.active]="vm().vistaActual === 'global'"
			data-info-anchor="tab-switch"
			(click)="onCambiarVista('global')"
			eduTooltip="Ver resumen de problemas"
			eduTooltipPosition="top"
		></button>
	</div>

	<div class="view-filters-inline">
		<edu-select
			[options]="estadoOptions"
			[ngModel]="vm().filtroEstadoActivo"
			data-info-anchor="admin-schedules-estado-select"
			(ngModelChange)="onFiltroEstadoChange($event)"
			placeholder="Todos los estados"
			optionLabel="label"
			optionValue="value"
			appendTo="body"
			[showClear]="true"
			styleClass="estado-filter-select"
		/>
		<edu-select
			[options]="completitudOptions"
			[ngModel]="vm().filtroCompletitud"
			data-info-anchor="admin-schedules-completitud-select"
			(ngModelChange)="onFiltroCompletitudChange($event)"
			placeholder="Todos los horarios"
			optionLabel="label"
			optionValue="value"
			appendTo="body"
			[showClear]="true"
			styleClass="completitud-filter-select"
			eduTooltip="Filtrar horarios sin profesor o sin estudiantes asignados"
			eduTooltipPosition="bottom"
		/>
		@if (vm().hasFilters) {
			<button
				pButton
				icon="pi pi-filter-slash"
				class="p-button-text p-button-sm"
				data-info-anchor="admin-schedules-limpiar-filtros-btn"
				(click)="onClearFiltros()"
				eduTooltip="Limpiar filtros"
				eduTooltipPosition="top"
				[pt]="{ root: { 'aria-label': 'Limpiar filtros' } }"
			></button>
		}
	</div>
</div>

<!-- #endregion -->
<!-- #region Vista Por Salón -->
@if (vm().vistaActual === 'salon') {
	<app-schedule-grid-layout
		[entities]="vm().salonEntities"
		[selectedEntityId]="vm().selectedEntityId"
		[blocks]="vm().entityWeeklyBlocks"
		[loading]="vm().loading"
		[isAdmin]="vm().isAdmin"
		entityLabel="Salón"
		[contextSalonId]="vm().contextSalonId"
		(entitySelect)="onSelectEntity($event)"
		(blockClick)="onViewDetail($event)"
		(emptySlotClick)="onEmptySlotClick($event)"
		(editClick)="onEdit($event)"
		(viewDetailClick)="onViewDetail($event)"
	/>
}

<!-- #endregion -->
<!-- #region Vista Por Profesor -->
@if (vm().vistaActual === 'profesor') {
	<app-schedule-grid-layout
		[entities]="vm().profesorEntities"
		[selectedEntityId]="vm().selectedEntityId"
		[blocks]="vm().entityWeeklyBlocks"
		[loading]="vm().loading"
		[isAdmin]="vm().isAdmin"
		entityLabel="Profesor"
		[contextSalonId]="null"
		(entitySelect)="onSelectEntity($event)"
		(blockClick)="onViewDetail($event)"
		(emptySlotClick)="onEmptySlotClick($event)"
		(editClick)="onEdit($event)"
		(viewDetailClick)="onViewDetail($event)"
	/>
}

<!-- #endregion -->
<!-- #region Vista Global -->
@if (vm().vistaActual === 'global') {
	<app-schedule-global-view
		[horarios]="vm().horariosFiltrados"
		[loading]="vm().loading"
		(viewDetail)="onViewDetail($event)"
	/>
}

<!-- #endregion -->
<!-- #region Dialog: Crear/Editar Horario -->
<app-schedules-form-dialog
	[visible]="vm().dialogVisible"
	[isEditing]="!!vm().editingId"
	[formData]="vm().formData"
	[salonesOptions]="vm().salonesOptions"
	[optionsLoading]="vm().optionsLoading"
	[formValid]="vm().formValid"
	[loading]="vm().loading"
	[cursoSeleccionadoLabel]="cursoSeleccionadoLabel()"
	[cursoSeleccionadoNiveles]="cursoSeleccionadoNiveles()"
	(visibleChange)="onCancelDialog()"
	(save)="onSaveHorario()"
	(openCursoDialog)="onOpenCursoDialog()"
	(clearCurso)="onSelectCurso(null!)"
/>

<!-- #endregion -->
<!-- #region ConfirmDialog -->
<edu-confirm-dialog />

<!-- #endregion -->
<!-- #region Modal de Seleccion de Cursos por Nivel -->
<app-schedules-course-picker
	[visible]="vm().cursoDialogVisible"
	[cursosPorNivel]="vm().cursosPorNivel"
	[loading]="vm().optionsLoading"
	[selectedCursoId]="vm().formData.cursoId"
	(visibleChange)="onCloseCursoDialog()"
	(cursoSelected)="onSelectCurso($event)"
/>

<!-- #endregion -->
<!-- #region Dialog: Importar Horarios -->
<app-schedules-import-dialog
	[visible]="vm().importDialogVisible"
	[loading]="vm().importLoading"
	[result]="vm().importResult"
	(visibleChange)="onImportDialogVisibleChange($event)"
	(importar)="onImportarHorarios($event)"
/>

<!-- #endregion -->
<!-- #region Detail Drawer - Asignaciones -->
<app-schedule-detail-drawer
	[visible]="vm().detailDrawerVisible"
	[detalle]="vm().horarioDetalle"
	[loading]="vm().detailLoading"
	[profesoresOptions]="vm().profesoresParaAsignacionDetalle"
	[modoAsignacion]="vm().modoAsignacionDetalle"
	[isAdmin]="vm().isAdmin"
	(visibleChange)="vm().detailDrawerVisible && !$event && onCloseDetailDrawer()"
	(closeDrawer)="onCloseDetailDrawer()"
	(edit)="onEdit($event)"
	(delete)="onDelete($event)"
	(toggleEstado)="onToggleEstado($event.id, $event.estadoActual)"
	(asignarProfesor)="onAsignarProfesor($event.horarioId, $event.profesorId)"
	(asignarTodosEstudiantes)="onAsignarTodosEstudiantes($event)"
	(desasignarProfesor)="onDesasignarProfesor($event)"
	(desasignarEstudiante)="onDesasignarEstudiante($event.horarioId, $event.estudianteId)"
/>
<!-- #endregion -->

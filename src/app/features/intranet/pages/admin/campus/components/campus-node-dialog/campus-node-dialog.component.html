<edu-dialog
	[visible]="visible()"
	(visibleChange)="onVisibleChange($event)"
	[modal]="true"
	[closable]="true"
	[showHeader]="false"
	[style]="{ width: '440px' }"
>
	<!-- #region Header -->
	<div class="piso-dialog-header">
		<div class="piso-dialog-icon editing">
			<i class="pi pi-pencil"></i>
		</div>
		<div class="piso-dialog-title">
			<h3>Editar Nodo</h3>
			<p>Modifica las propiedades del nodo seleccionado</p>
		</div>
	</div>
	<!-- #endregion -->

	<!-- #region Form -->
	<div class="piso-dialog-form">
		<div class="form-field">
			<label for="nodeEtiqueta">
				<i class="pi pi-tag"></i>
				Nombre / Etiqueta
			</label>
			<input
				eduInputText
				id="nodeEtiqueta"
				[ngModel]="formData().etiqueta"
				(ngModelChange)="onEtiquetaChange($event)"
				placeholder="Ej: Aula 101, Baño Varones..."
				data-info-anchor="admin-campus-nodo-form-etiqueta-input"
			/>
		</div>
		<div class="form-field">
			<label for="nodeTipo">
				<i class="pi pi-th-large"></i>
				Tipo
			</label>
			<edu-select
				id="nodeTipo"
				[options]="nodeTypeOptions()"
				[ngModel]="formData().tipo"
				(ngModelChange)="onTipoChange($event)"
				optionLabel="label"
				optionValue="value"
				appendTo="body"
				data-info-anchor="admin-campus-nodo-form-tipo-select"
			/>
		</div>
		<div class="form-row">
			<div class="form-field">
				<label for="nodeWidth">
					<i class="pi pi-arrows-h"></i>
					Ancho
				</label>
				<edu-input-number
					id="nodeWidth"
					[ngModel]="formData().width"
					(ngModelChange)="onWidthChange($event)"
					[min]="0"
					[max]="500"
					[showButtons]="true"
					[step]="10"
					data-info-anchor="admin-campus-nodo-form-width-input"
				/>
			</div>
			<div class="form-field">
				<label for="nodeHeight">
					<i class="pi pi-arrows-v"></i>
					Alto
				</label>
				<edu-input-number
					id="nodeHeight"
					[ngModel]="formData().height"
					(ngModelChange)="onHeightChange($event)"
					[min]="0"
					[max]="500"
					[showButtons]="true"
					[step]="10"
					data-info-anchor="admin-campus-nodo-form-height-input"
				/>
			</div>
		</div>
	</div>
	<!-- #endregion -->

	<!-- #region Footer -->
	<div class="piso-dialog-footer">
		<button
			pButton
			label="Cancelar"
			class="p-button-text p-button-secondary"
			(click)="onCancel()"
			data-info-anchor="admin-campus-nodo-form-cancelar-btn"
		></button>
		<button
			pButton
			label="Guardar cambios"
			icon="pi pi-check"
			(click)="onSave()"
			[loading]="saving()"
			data-info-anchor="admin-campus-nodo-form-guardar-btn"
		></button>
	</div>
	<!-- #endregion -->
</edu-dialog>

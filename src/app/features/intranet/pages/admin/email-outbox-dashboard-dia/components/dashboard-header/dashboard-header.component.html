<!-- #region Header -->
<app-page-header
	icon="pi pi-chart-bar"
	title="Dashboard del día"
	[subtitle]="generatedAtLabel() || 'Snapshot de envíos, fallos y bounces'"
>
	<div class="header-actions">
		<!-- * Date picker con maxDate=hoy y minDate=hoy-90d -->
		<edu-datepicker
			[ngModel]="selectedDate()"
			[showIcon]="true"
			[maxDate]="maxDate()"
			[minDate]="minDate()"
			dateFormat="yy-mm-dd"
			placeholder="Hoy"
			appendTo="body"
			(ngModelChange)="onDateChange($event)"
			class="fecha-picker"
			data-info-anchor="admin-email-outbox-dashboard-fecha-picker"
		/>

		@if (fechaConsulta()) {
			<button
				pButton
				icon="pi pi-times"
				class="p-button-text p-button-sm btn-icon"
				eduTooltip="Volver a hoy"
				(click)="onClearDate()"
				data-info-anchor="admin-email-outbox-dashboard-fecha-clear"
				[pt]="{ root: { 'aria-label': 'Volver a hoy' } }"
			></button>
		}

		<span class="action-divider"></span>

		<button
			pButton
			icon="pi pi-refresh"
			class="p-button-text p-button-sm btn-icon"
			eduTooltip="Refrescar"
			[disabled]="loading()"
			(click)="onRefresh()"
			data-info-anchor="admin-email-outbox-dashboard-refresh"
			[pt]="{ root: { 'aria-label': 'Refrescar' } }"
		></button>
	</div>
</app-page-header>
<!-- #endregion -->

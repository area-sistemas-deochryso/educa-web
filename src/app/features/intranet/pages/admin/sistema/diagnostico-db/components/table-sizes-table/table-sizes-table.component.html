<section class="table-sizes">
	<header class="section-header">
		<div class="section-title">
			<i class="pi pi-table"></i>
			<h3>Tamaño de tablas</h3>
		</div>
		<edu-button
			icon="pi pi-refresh"
			[text]="true"
			size="small"
			[loading]="loading()"
			data-info-anchor="admin-diagnostico-db-refresh-btn"
			(click)="onRefresh()"
		/>
	</header>

	@if (error()) {
		<div class="empty-state">
			<i class="pi pi-exclamation-triangle"></i>
			<span>{{ error() }}</span>
		</div>
	}

	@if (tables().length === 0 && !loading() && !error()) {
		<div class="empty-state">
			<i class="pi pi-info-circle"></i>
			<span>Sin datos de tablas disponibles.</span>
		</div>
	}

	@if (tables().length > 0) {
		<edu-table [value]="tables()" [dataKey]="'tableName'" [tableStyle]="{ 'min-width': '30rem' }" [sortField]="'reservedMb'" [sortOrder]="-1">
			<ng-template #header>
				<tr>
					<th eduSortableColumn="tableName" data-info-anchor="tabla-orden-columna">Tabla</th>
					<th eduSortableColumn="rowCount" style="width: 10rem" data-info-anchor="tabla-orden-columna">Filas</th>
					<th eduSortableColumn="reservedMb" style="width: 10rem" data-info-anchor="tabla-orden-columna">Tamaño (MB)</th>
				</tr>
			</ng-template>
			<ng-template #body let-row>
				<tr>
					<td><code>{{ row.tableName }}</code></td>
					<td>{{ row.rowCount | number }}</td>
					<td>{{ row.reservedMb | number: '1.1-1' }} MB</td>
				</tr>
			</ng-template>
		</edu-table>
	}
</section>

<section class="slow-requests">
	<header class="section-header">
		<div class="section-title">
			<i class="pi pi-stopwatch"></i>
			<h3>Consultas lentas</h3>
		</div>
		<button
			pButton
			icon="pi pi-refresh"
			class="p-button-text p-button-sm"
			[loading]="loading()"
			data-info-anchor="admin-runtime-health-slow-refresh-btn"
			(click)="onRefresh()"
		></button>
	</header>

	@if (slowRequests().length === 0 && !loading()) {
		<div class="empty-state">
			<i class="pi pi-check-circle"></i>
			<span>No hay datos de consultas lentas.</span>
		</div>
	}

	@if (slowRequests().length > 0) {
		<edu-table
			[value]="slowRequests()"
			[dataKey]="'path'"
			[tableStyle]="{ 'min-width': '40rem' }"
			[sortField]="'p95'"
			[sortOrder]="-1"
		>
			<ng-template #header>
				<tr>
					<th eduSortableColumn="path" data-info-anchor="tabla-orden-columna">Endpoint</th>
					<th eduSortableColumn="p50" style="width: 6rem" data-info-anchor="tabla-orden-columna">p50</th>
					<th eduSortableColumn="p95" style="width: 6rem" data-info-anchor="tabla-orden-columna">p95</th>
					<th eduSortableColumn="p99" style="width: 6rem" data-info-anchor="tabla-orden-columna">p99</th>
					<th eduSortableColumn="count" style="width: 6rem" data-info-anchor="tabla-orden-columna">Count</th>
				</tr>
			</ng-template>
			<ng-template #body let-row>
				<tr>
					<td class="endpoint-cell">
						<code>{{ row.path }}</code>
					</td>
					<td>{{ row.p50 | number: '1.0-0' }} ms</td>
					<td>
						<edu-tag
							[value]="(row.p95 | number: '1.0-0') + ' ms'"
							[severity]="getLatencySeverity(row.p95)"
						/>
					</td>
					<td>{{ row.p99 | number: '1.0-0' }} ms</td>
					<td>{{ row.count | number }}</td>
				</tr>
			</ng-template>
		</edu-table>
	}
</section>

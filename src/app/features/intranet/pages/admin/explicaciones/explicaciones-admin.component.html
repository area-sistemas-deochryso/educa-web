<edu-toast />

<app-page-header icon="pi pi-info-circle" title="Gestión del modo informativo" subtitle="Administra las explicaciones que aparecen en el modo informativo">
	<div class="explicaciones-admin-toolbar">
		<div class="search-box">
			<i class="pi pi-search"></i>
			<input
				type="text"
				eduInputText
				placeholder="Buscar por ancla..."
				[ngModel]="facade.searchTerm()"
				(ngModelChange)="onSearchChange($event)"
				data-info-anchor="admin-explicaciones-buscar-input"
			/>
		</div>

		<edu-button
			icon="pi pi-refresh"
			[text]="true"
			size="small"
			eduTooltip="Refrescar"
			(click)="facade.load()"
			[pt]="{ root: { 'aria-label': 'Refrescar listado' } }"
			data-info-anchor="admin-explicaciones-refresh-btn"
		/>

		<edu-button
			label="Nueva explicación"
			icon="pi pi-plus"
			size="small"
			severity="success"
			(click)="onOpenCreate()"
			[pt]="{ root: { 'aria-label': 'Crear nueva explicación' } }"
			data-info-anchor="admin-explicaciones-nueva-btn"
		/>
	</div>
</app-page-header>

@if (facade.error()) {
	<p class="explicaciones-admin-error">No se pudo cargar el listado de explicaciones. Intenta refrescar.</p>
}

<app-explicacion-admin-table
	[items]="facade.filteredExplicaciones()"
	[loading]="facade.loading()"
	(edit)="onOpenEdit($event)"
	(remove)="onRemove($event)"
/>

<app-explicacion-admin-form-dialog
	[visible]="dialogVisible()"
	[explicacion]="selectedExplicacion()"
	[roles]="rolService.roles()"
	[capabilities]="capabilities()"
	[saving]="facade.saving()"
	(visibleChange)="onDialogVisibleChange($event)"
	(saveExplicacion)="onDialogSave($event)"
	(cancelForm)="onDialogCancel()"
/>

<edu-confirm-dialog />

<p-dialog
	[header]="headerLabel()"
	[visible]="visible()"
	(visibleChange)="onHide()"
	[modal]="true"
	[style]="{ width: '40rem' }"
	[draggable]="false"
	appendTo="body"
>
	<div class="explicacion-form">
		<div class="field">
			<label for="explicacion-ancla">Ancla *</label>
			<input
				id="explicacion-ancla"
				type="text"
				pInputText
				class="w-full"
				[ngModel]="ancla()"
				(ngModelChange)="ancla.set($event)"
				maxlength="150"
				placeholder="Clave data-info-anchor del elemento"
				data-info-anchor="admin-explicaciones-form-ancla-input"
			/>
		</div>

		<div class="field">
			<label for="explicacion-texto">Texto *</label>
			<textarea
				id="explicacion-texto"
				pTextarea
				class="w-full"
				[rows]="4"
				[ngModel]="texto()"
				(ngModelChange)="texto.set($event)"
				data-info-anchor="admin-explicaciones-form-texto-textarea"
			></textarea>
		</div>

		<div class="field-row">
			<div class="field">
				<label for="explicacion-rol">Rol</label>
				<p-select
					id="explicacion-rol"
					[options]="rolOptions()"
					optionLabel="label"
					optionValue="value"
					[ngModel]="rolId()"
					(ngModelChange)="rolId.set($event)"
					placeholder="Default (todos los roles)"
					appendTo="body"
					class="w-full"
					data-info-anchor="admin-explicaciones-form-rol-select"
				/>
			</div>

			<div class="field">
				<label for="explicacion-capability">Visible para</label>
				<p-select
					id="explicacion-capability"
					[options]="capabilityOptions()"
					optionLabel="label"
					optionValue="value"
					[ngModel]="capabilityId()"
					(ngModelChange)="capabilityId.set($event)"
					placeholder="Sin gating (todos)"
					appendTo="body"
					class="w-full"
					data-info-anchor="admin-explicaciones-form-capability-select"
				/>
			</div>
		</div>
	</div>

	<ng-template pTemplate="footer">
		<button
			pButton
			type="button"
			label="Cancelar"
			class="p-button-text"
			(click)="onCancel()"
			[pt]="{ root: { 'aria-label': 'Cancelar' } }"
			data-info-anchor="admin-explicaciones-form-cancelar-btn"
		></button>
		<button
			pButton
			type="button"
			label="Guardar"
			icon="pi pi-check"
			[disabled]="!isValid() || saving()"
			[loading]="saving()"
			(click)="onSave()"
			[pt]="{ root: { 'aria-label': 'Guardar explicación' } }"
			data-info-anchor="admin-explicaciones-form-guardar-btn"
		></button>
	</ng-template>
</p-dialog>

<edu-table [value]="items()" [loading]="loading()" dataKey="id" responsiveLayout="scroll" styleClass="explicacion-admin-table">
	<ng-template pTemplate="header">
		<tr>
			<th>Ancla</th>
			<th>Rol</th>
			<th>Texto</th>
			<th>Capability</th>
			<th>Estado</th>
			<th style="width: 8rem">Acciones</th>
		</tr>
	</ng-template>
	<ng-template pTemplate="body" let-explicacion>
		<tr>
			<td>{{ explicacion.ancla }}</td>
			<td>
				@if (!explicacion.rolId) {
					<edu-tag severity="info" value="Default" />
				} @else {
					{{ explicacion.rolNombre }}
				}
			</td>
			<td class="texto-cell">{{ explicacion.texto }}</td>
			<td>{{ explicacion.capabilityCodigo || 'Todos' }}</td>
			<td>
				<edu-tag [severity]="explicacion.estado ? 'success' : 'danger'" [value]="explicacion.estado ? 'Activa' : 'Inactiva'" />
			</td>
			<td>
				<button
					pButton
					icon="pi pi-pencil"
					class="p-button-text p-button-sm"
					eduTooltip="Editar"
					eduTooltipPosition="top"
					(click)="edit.emit(explicacion)"
					[pt]="{ root: { 'aria-label': 'Editar ' + explicacion.ancla } }"
					data-info-anchor="admin-explicaciones-fila-editar-btn"
				></button>
				<button
					pButton
					icon="pi pi-trash"
					class="p-button-text p-button-sm p-button-danger"
					eduTooltip="Eliminar"
					eduTooltipPosition="top"
					(click)="remove.emit(explicacion)"
					[pt]="{ root: { 'aria-label': 'Eliminar ' + explicacion.ancla } }"
					data-info-anchor="admin-explicaciones-fila-eliminar-btn"
				></button>
			</td>
		</tr>
	</ng-template>
	<ng-template pTemplate="emptymessage">
		<tr>
			<td colspan="6">No hay explicaciones registradas.</td>
		</tr>
	</ng-template>
</edu-table>

<app-page-header
	icon="pi pi-search"
	title="Gap asistencia vs correos"
	[subtitle]="generatedAtLabel() || 'Quiénes marcaron entrada y por qué no llegó su correo'"
>
	<div class="header-actions">
		<edu-datepicker
			[ngModel]="selectedDate()"
			[showIcon]="true"
			[maxDate]="maxDate()"
			[minDate]="minDate()"
			dateFormat="yy-mm-dd"
			placeholder="Hoy"
			appendTo="body"
			(ngModelChange)="onDateChange($event)"
			class="fecha-picker"
			data-info-anchor="email-fecha-picker"
		/>

		@if (fechaConsulta()) {
			<edu-button
				icon="pi pi-times"
				[text]="true"
				size="small"
				class="btn-icon"
				eduTooltip="Volver a hoy"
				(click)="onClearDate()"
				[pt]="{ root: { 'aria-label': 'Volver a hoy' } }"
				data-info-anchor="admin-email-outbox-diagnostico-volver-hoy-btn"
			/>
		}

		<span class="action-divider"></span>

		<edu-button
			icon="pi pi-refresh"
			[text]="true"
			size="small"
			class="btn-icon"
			eduTooltip="Refrescar"
			[disabled]="loading()"
			(click)="onRefresh()"
			[pt]="{ root: { 'aria-label': 'Refrescar' } }"
			data-info-anchor="refrescar-btn"
		/>
	</div>
</app-page-header>

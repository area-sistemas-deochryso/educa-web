<!-- Plan 39 Chat D — Banner B9 cross-páginas (defer-fail / mailbox-full) -->
<app-email-defer-fail-banner />

<edu-tabs [value]="activeTab()" (valueChange)="onTabChange($event)" class="diagnostico-tabs">
	
		<edu-tab value="gap" data-info-anchor="tab-switch">
			<i class="pi pi-search"></i>
			<span>Gap del día</span>
		</edu-tab>
		<edu-tab value="correo" data-info-anchor="tab-switch">
			<i class="pi pi-envelope"></i>
			<span>Diagnóstico por correo</span>
		</edu-tab>
	

	
		<edu-tabpanel value="gap">
			<app-tab-correos-dia />
		</edu-tabpanel>

		<edu-tabpanel value="correo">
			<app-tab-correo-individual [initialCorreo]="initialCorreo()" />
		</edu-tabpanel>
	
</edu-tabs>

<edu-table [value]="items()" [loading]="loading()" dataKey="id" responsiveLayout="scroll" styleClass="faq-admin-table">
	<ng-template pTemplate="header">
		<tr>
			<th>Pregunta</th>
			<th>Categoría</th>
			<th>Capability</th>
			<th>Wizard</th>
			<th>Estado</th>
			<th style="width: 8rem">Acciones</th>
		</tr>
	</ng-template>
	<ng-template pTemplate="body" let-faq>
		<tr>
			<td>{{ faq.pregunta }}</td>
			<td>{{ faq.categoria || '—' }}</td>
			<td>{{ faq.capabilityCodigo || 'Todos' }}</td>
			<td>
				@if (pasosCount(faq) > 0) {
					<edu-tag severity="info" [value]="pasosCount(faq) + ' pasos'" />
				} @else {
					<span>—</span>
				}
			</td>
			<td>
				<edu-tag [severity]="faq.estado ? 'success' : 'danger'" [value]="faq.estado ? 'Activa' : 'Inactiva'" />
			</td>
			<td>
				<edu-button
					icon="pi pi-pencil"
					[text]="true"
					size="small"
					eduTooltip="Editar"
					eduTooltipPosition="top"
					(click)="edit.emit(faq)"
					[pt]="{ root: { 'aria-label': 'Editar ' + faq.pregunta } }"
					data-info-anchor="admin-faq-fila-editar-btn"
				/>
				<edu-button
					icon="pi pi-trash"
					[text]="true"
					size="small"
					severity="danger"
					eduTooltip="Eliminar"
					eduTooltipPosition="top"
					(click)="remove.emit(faq)"
					[pt]="{ root: { 'aria-label': 'Eliminar ' + faq.pregunta } }"
					data-info-anchor="admin-faq-fila-eliminar-btn"
				/>
			</td>
		</tr>
	</ng-template>
	<ng-template pTemplate="emptymessage">
		<tr>
			<td colspan="6">No hay FAQ registradas.</td>
		</tr>
	</ng-template>
</edu-table>

<p-toast />

<div class="faq-admin-header">
	<h2>Gestión de FAQ</h2>
	<div class="faq-admin-toolbar">
		<div class="search-box">
			<i class="pi pi-search"></i>
			<input
				type="text"
				pInputText
				placeholder="Buscar por pregunta..."
				[ngModel]="facade.searchTerm()"
				(ngModelChange)="onSearchChange($event)"
				data-info-anchor="admin-faq-buscar-input"
			/>
		</div>

		<button
			pButton
			icon="pi pi-refresh"
			class="p-button-text p-button-sm"
			pTooltip="Refrescar"
			(click)="facade.load()"
			[pt]="{ root: { 'aria-label': 'Refrescar listado' } }"
			data-info-anchor="admin-faq-refrescar-btn"
		></button>

		<button
			pButton
			label="Nueva FAQ"
			icon="pi pi-plus"
			class="p-button-success p-button-sm"
			(click)="onOpenCreate()"
			[pt]="{ root: { 'aria-label': 'Crear nueva FAQ' } }"
			data-info-anchor="admin-faq-nueva-btn"
		></button>
	</div>
</div>

@if (facade.error()) {
	<p class="faq-admin-error">No se pudo cargar el listado de FAQ. Intenta refrescar.</p>
}

<app-faq-admin-table
	[items]="facade.filteredFaqs()"
	[loading]="facade.loading()"
	(edit)="onOpenEdit($event)"
	(remove)="onRemove($event)"
/>

<app-faq-admin-form-dialog
	[visible]="dialogVisible()"
	[faq]="selectedFaq()"
	[capabilities]="capabilities()"
	[saving]="facade.saving()"
	(visibleChange)="onDialogVisibleChange($event)"
	(saveFaq)="onDialogSave($event)"
	(cancelForm)="onDialogCancel()"
/>

<p-confirmDialog />

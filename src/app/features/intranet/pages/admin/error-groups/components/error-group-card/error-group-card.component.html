<div class="card-header">
	<div class="card-header-tags">
		<edu-tag
			[value]="group().severidad"
			[severity]="severidadSeverity()"
			styleClass="severity-tag"
		/>
		@if (hasPostResolucion()) {
			<edu-tag
				value="Reabierto"
				severity="danger"
				icon="pi pi-history"
				styleClass="regresion-tag"
				[eduTooltip]="'Reabierto — ' + group().contadorPostResolucion + ' ocurrencia(s) después de resolver'"
				eduTooltipPosition="top"
			/>
		}
	</div>
	<span class="counter" eduTooltip="Ocurrencias totales" eduTooltipPosition="top">
		<i class="pi pi-list"></i>
		{{ group().contadorTotal }}
	</span>
</div>

<div class="card-usuarios" eduTooltip="Usuarios únicos afectados" eduTooltipPosition="top">
	<i class="pi pi-users"></i>
	{{ group().usuariosUnicos }}
</div>

<div class="card-body">
	<span
		class="message"
		[eduTooltip]="group().mensajeRepresentativo"
		eduTooltipPosition="top"
	>
		{{ group().mensajeRepresentativo }}
	</span>
	@if (group().errorCode) {
		<span class="error-code">{{ group().errorCode }}</span>
	}
</div>

<div class="card-sparkline">
	@if (trendLoading()) {
		<span class="card-sparkline__loading" aria-label="Cargando ocurrencias">…</span>
	} @else {
		<button
			type="button"
			class="card-sparkline__btn"
			(click)="onSparklineClick($event)"
			[attr.aria-label]="'Ver ocurrencias 30 días ampliado de ' + group().mensajeRepresentativo"
			eduTooltip="Ver ocurrencias 30 días ampliado"
			eduTooltipPosition="top"
			data-info-anchor="admin-error-groups-sparkline-btn"
		>
			<app-error-occurrence-timeline
				[data]="trendData()"
				[height]="28"
				[ariaLabel]="'Ocurrencias de los últimos 30 días de ' + group().mensajeRepresentativo"
			/>
		</button>
	}
</div>

<div class="card-footer">
	<span class="origen" [eduTooltip]="group().origen" eduTooltipPosition="top">
		<i [class]="origenIcon()"></i>
	</span>
	<span class="fecha">{{ group().ultimaFecha | date: 'dd/MM HH:mm' }}</span>
</div>

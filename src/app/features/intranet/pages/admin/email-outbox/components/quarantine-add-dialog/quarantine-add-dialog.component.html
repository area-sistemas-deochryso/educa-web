<edu-dialog
	[visible]="visible()"
	(visibleChange)="onVisibleChange($event)"
	header="Agregar cuarentena manual"
	[modal]="true"
	[style]="{ width: '520px' }"
	[draggable]="false"
	[resizable]="false"
	class="quarantine-add-dialog"
>
	<div class="dialog-content">
		<div class="form-grid">
			<div class="field full-width">
				<label for="qt-destinatario">Destinatario *</label>
				<input
					id="qt-destinatario"
					eduInputText
					data-info-anchor="admin-email-outbox-quarantine-destinatario-input"
					type="email"
					autocomplete="off"
					[ngModel]="formData().destinatario"
					(ngModelChange)="onDestinatarioChange($event)"
					placeholder="ejemplo@dominio.com"
					[disabled]="submitting()"
				/>
				@if (touched() && destinatarioError()) {
					<small class="p-error">{{ destinatarioError() }}</small>
				}
			</div>

			<div class="field full-width">
				<label for="qt-duration">Duración *</label>
				<edu-select
					inputId="qt-duration"
					data-info-anchor="admin-email-outbox-quarantine-duration-select"
					[options]="durationOptions"
					optionLabel="label"
					optionValue="value"
					[ngModel]="formData().durationHours"
					(ngModelChange)="onDurationChange($event)"
					appendTo="body"
					[disabled]="submitting()"
				/>
			</div>

			<div class="field full-width">
				<label for="qt-observacion">Observación *</label>
				<textarea
					id="qt-observacion"
					eduTextarea
					data-info-anchor="admin-email-outbox-quarantine-observacion-textarea"
					rows="3"
					maxlength="500"
					autocomplete="off"
					[ngModel]="formData().observacion"
					(ngModelChange)="onObservacionChange($event)"
					placeholder="Razón explícita (apoderado pidió pausa, dispositivo de prueba, etc.)"
					[disabled]="submitting()"
				></textarea>
				@if (touched() && observacionError()) {
					<small class="p-error">{{ observacionError() }}</small>
				} @else {
					<small class="hint">Mínimo 5 caracteres. Máx. 500.</small>
				}
			</div>
		</div>
	</div>

	<ng-template #footer>
		<div class="dialog-footer">
			<edu-button
				label="Cancelar"
				icon="pi pi-times"
				[text]="true"
				data-info-anchor="email-outbox-dialog-cancel-btn"
				(click)="onCancel()"
				[disabled]="submitting()"
				[pt]="{ root: { 'aria-label': 'Cancelar' } }"
			/>
			<edu-button
				label="Cuarentena"
				icon="pi pi-shield"
				severity="success"
				data-info-anchor="admin-email-outbox-quarantine-crear-btn"
				(click)="onConfirm()"
				[disabled]="!canSubmit()"
				[pt]="{ root: { 'aria-label': 'Crear cuarentena manual' } }"
			/>
		</div>
	</ng-template>
</edu-dialog>

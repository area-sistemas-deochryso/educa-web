<!-- #region Filtros -->
<div class="filters-bar">
	<div class="field field--search">
		<label class="label-uppercase" for="filter-buscar">Buscar</label>
		<edu-icon-field>
			<edu-input-icon styleClass="pi pi-search" />
			<input
				id="filter-buscar"
				eduInputText
				type="text"
				data-info-anchor="email-outbox-search-input"
				placeholder="Destinatario o asunto..."
				(input)="searchChange.emit($any($event.target).value)"
			/>
		</edu-icon-field>
	</div>

	<div class="field">
		<label class="label-uppercase" for="filter-tipo">Tipo de correo</label>
		<edu-select
			inputId="filter-tipo"
			data-info-anchor="admin-email-outbox-tipo-filter-select"
			[options]="tipoOptions"
			[ngModel]="filterTipo()"
			(ngModelChange)="filterTipoChange.emit($event)"
			optionLabel="label"
			optionValue="value"
			placeholder="Todos los tipos"
			appendTo="body"
		/>
	</div>

	<div class="field">
		<label class="label-uppercase" for="filter-estado">Estado del envío</label>
		<edu-select
			inputId="filter-estado"
			data-info-anchor="email-outbox-status-filter-select"
			[options]="estadoOptions"
			[ngModel]="filterEstado()"
			(ngModelChange)="filterEstadoChange.emit($event)"
			optionLabel="label"
			optionValue="value"
			placeholder="Todos los estados"
			appendTo="body"
		/>
	</div>

	<div class="field">
		<label class="label-uppercase" for="filter-tipo-fallo">Tipo de fallo</label>
		<edu-select
			inputId="filter-tipo-fallo"
			data-info-anchor="admin-email-outbox-tipo-fallo-filter-select"
			[options]="tipoFalloOptions"
			[ngModel]="filterTipoFallo()"
			(ngModelChange)="filterTipoFalloChange.emit($event)"
			optionLabel="label"
			optionValue="value"
			placeholder="Cualquier fallo"
			appendTo="body"
		/>
	</div>

	<div class="field">
		<label class="label-uppercase" for="filter-smtp-code">Código SMTP</label>
		<edu-select
			inputId="filter-smtp-code"
			data-info-anchor="admin-email-outbox-smtp-code-filter-select"
			[options]="smtpCodeOptions"
			[ngModel]="filterLastSmtpCode()"
			(ngModelChange)="filterLastSmtpCodeChange.emit($event)"
			optionLabel="label"
			optionValue="value"
			placeholder="Cualquier código"
			appendTo="body"
		/>
	</div>

	<div class="field">
		<label class="label-uppercase">Desde</label>
		<edu-datepicker
			placeholder="dd/mm/yyyy"
			dateFormat="yy-mm-dd"
			[showIcon]="true"
			appendTo="body"
			data-info-anchor="admin-email-outbox-filtro-desde-datepicker"
			[ngModel]="desde()"
			(ngModelChange)="onDesdeChange($event)"
			[showClear]="true"
		/>
	</div>

	<div class="field">
		<label class="label-uppercase">Hasta</label>
		<edu-datepicker
			placeholder="dd/mm/yyyy"
			dateFormat="yy-mm-dd"
			[showIcon]="true"
			appendTo="body"
			data-info-anchor="admin-email-outbox-filtro-hasta-datepicker"
			[ngModel]="hasta()"
			(ngModelChange)="onHastaChange($event)"
			[showClear]="true"
		/>
	</div>

	<div class="field">
		<label class="label-uppercase" for="filter-correlation">Correlation ID</label>
		<input
			id="filter-correlation"
			eduInputText
			type="text"
			data-info-anchor="admin-email-outbox-correlation-input"
			placeholder="ID de correlación"
			[ngModel]="filterCorrelationId()"
			(ngModelChange)="onCorrelationIdInput($event)"
		/>
	</div>

	<div class="field field--clear">
		<edu-button
			type="button"
			icon="pi pi-filter-slash"
			[text]="true"
			class="btn-clear"
			eduTooltip="Limpiar filtros"
			eduTooltipPosition="top"
			data-info-anchor="email-outbox-clear-filters-btn"
			(click)="onClearFilters()"
			[pt]="{
				root: {
					'aria-label': 'Limpiar filtros',
				},
			}"
		/>
	</div>
</div>
<!-- #endregion -->

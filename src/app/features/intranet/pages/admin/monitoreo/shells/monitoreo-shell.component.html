<!-- #region Tabs -->
<edu-tabs [value]="activeTab()" (valueChange)="onTabChange($event)">
	
		@for (tab of tabs(); track tab.value) {
			<edu-tab [value]="tab.value" data-info-anchor="tab-switch">
				<i [class]="tab.icon + ' mr-2'"></i>
				{{ tab.label }}
			</edu-tab>
		}
	
</edu-tabs>
<!-- #endregion -->

<!-- #region Outlet -->
<router-outlet />
<!-- #endregion -->

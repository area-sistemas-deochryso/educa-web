<!-- #region Header: título + acción principal (el contexto vive en la barra de abajo) -->
<app-page-header icon="pi pi-building" title="Gestión de Salones" [subtitle]="subtitle()">
	<edu-button
		icon="pi pi-refresh"
		[text]="true"
		severity="secondary"
		(click)="onRefresh()"
		[pt]="{
			root: {
				'aria-label': 'Refrescar',
			},
		}"
		eduTooltip="Refrescar"
		eduTooltipPosition="bottom"
		data-info-anchor="admin-salones-refresh-btn"
	/>
	<edu-button
		label="Nuevo Salón"
		icon="pi pi-plus"
		severity="success"
		(click)="onOpenNuevoSalonDialog()"
		data-info-anchor="admin-salones-nuevo-btn"
	/>
</app-page-header>
<!-- #endregion -->

@if (vm().error) {
	<div class="error-banner">
		<i class="pi pi-exclamation-triangle"></i>
		<span>{{ vm().error }}</span>
	</div>
}

<!-- #region Barra de contexto: periodo → año → nivel → estado (de lo más general a lo más específico) -->
<div class="context-bar">
	<div class="context-period">
		<app-period-toggle
			[value]="vm().esVerano"
			(valueChange)="onPeriodoChange($event)"
			data-info-anchor="period-toggle"
		/>

		<div class="year-stepper" role="group" aria-label="Año">
			<button
				type="button"
				class="step-btn"
				aria-label="Año anterior"
				[disabled]="vm().filtroAnio <= anioMin"
				(click)="onAnioStep(-1)"
				data-info-anchor="admin-salones-anio-prev-btn"
			>
				<i class="pi pi-chevron-left"></i>
			</button>
			<output class="year-value" aria-live="polite" data-info-anchor="admin-salones-anio-filter-input">{{ vm().filtroAnio }}</output>
			<button
				type="button"
				class="step-btn"
				aria-label="Año siguiente"
				[disabled]="vm().filtroAnio >= anioMax"
				(click)="onAnioStep(1)"
				data-info-anchor="admin-salones-anio-next-btn"
			>
				<i class="pi pi-chevron-right"></i>
			</button>
		</div>
	</div>

	<div class="nivel-tabs" role="tablist" aria-label="Nivel educativo">
		@for (nivel of niveles; track nivel) {
			<button
				type="button"
				role="tab"
				class="nivel-tab"
				[class.active]="vm().selectedNivel === nivel"
				[attr.aria-selected]="vm().selectedNivel === nivel"
				(click)="onNivelChange(nivel)"
				data-info-anchor="admin-salones-nivel-tab"
			>
				{{ nivel }}
			</button>
		}
	</div>

	<!-- Estado del periodo y sus acciones (config, cierre) agrupados en un solo menú -->
	<div class="period-menu">
		<edu-button
			[label]="periodLabel()"
			icon="pi pi-sliders-h"
			[outlined]="true"
			severity="secondary"
			size="small"
			(click)="onTogglePeriodMenu($event)"
			[pt]="{
				root: {
					'aria-label': 'Acciones del periodo: ' + periodLabel(),
					'aria-haspopup': 'menu',
				},
			}"
			data-info-anchor="admin-salones-periodo-menu-btn"
		/>
		<edu-menu #periodMenu [model]="periodMenuItems()" [popup]="true" appendTo="body" />
	</div>
</div>
<!-- #endregion -->

<!-- #region Tabla de salones -->
<!-- El @for de un solo elemento recrea la tabla al cambiar de nivel, así los filtros y la vista no arrastran valores del nivel anterior. -->
@for (nivel of [vm().selectedNivel]; track nivel) {
	<app-classrooms-admin-table
		[salones]="vm().salones"
		[loading]="vm().loading"
		[estadisticas]="vm().statsReady ? vm().estadisticas : null"
		(selectSalon)="onSelectSalon($event)"
		(goToHorarios)="onGoToHorarios($event)"
		(goToUsuarios)="onGoToUsuarios($event)"
	/>
}
<!-- #endregion -->

<!-- #region Dialogs — siempre en el DOM -->
<app-config-grade-dialog
	[visible]="vm().configDialogVisible"
	[config]="vm().configActual"
	[nivel]="vm().selectedNivel"
	[anio]="vm().filtroAnio"
	[loading]="vm().loading"
	(visibleChange)="onConfigDialogVisibleChange($event)"
	(crear)="onCrearConfig($event)"
	(actualizar)="onActualizarConfig($event)"
/>

<app-close-period-dialog
	[visible]="vm().cerrarPeriodoDialogVisible"
	[periodo]="vm().periodoActual"
	[nivel]="vm().selectedNivel"
	[estadisticas]="vm().estadisticas"
	[loading]="vm().loading"
	(visibleChange)="onCerrarPeriodoDialogVisibleChange($event)"
	(confirmar)="onConfirmarCierrePeriodo($event)"
/>

<app-classroom-detail-dialog
	[visible]="vm().salonDialogVisible"
	[salon]="vm().selectedSalon"
	[periodoId]="vm().periodoActual?.id ?? null"
	[periodoCerrado]="vm().periodoCerrado"
	[aprobaciones]="vm().aprobaciones"
	[aprobacionesLoading]="vm().aprobacionesLoading"
	[asistenciaData]="vm().salonAsistencia"
	[asistenciaLoading]="vm().asistenciaLoading"
	[notasData]="vm().salonNotas"
	[notasLoading]="vm().notasLoading"
	[horarios]="vm().salonHorarios"
	[horariosLoading]="vm().horariosLoading"
	[salonesDisponibles]="salonesDisponibles()"
	(visibleChange)="onSalonDialogVisibleChange($event)"
	(aprobar)="onAprobarEstudiante($event)"
	(aprobarMasivo)="onAprobarMasivo($event)"
	(loadAsistencia)="onLoadAsistencia($event)"
	(loadNotas)="onLoadNotas($event)"
/>

<app-nuevo-salon-dialog
	[visible]="vm().nuevoSalonDialogVisible"
	[anioDefault]="vm().filtroAnio"
	[loading]="vm().loading"
	(visibleChange)="onNuevoSalonDialogVisibleChange($event)"
	(crear)="onCrearSalon($event)"
/>
<!-- #endregion -->

<edu-toast />
<edu-confirm-dialog />

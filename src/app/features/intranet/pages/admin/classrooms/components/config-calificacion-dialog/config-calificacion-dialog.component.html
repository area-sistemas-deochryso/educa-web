<edu-dialog
	header="Configuración de Calificaciones — {{ nivel() }}"
	[visible]="visible()"
	(visibleChange)="onVisibleChange($event)"
	[modal]="true"
	[style]="{ width: '600px' }"
	[closable]="true"
>
	<!-- #region Tipo de calificación -->
	<div class="mb-4">
		<label class="block mb-2 font-medium">Tipo de Calificación</label>
		<edu-select
			[options]="tipoOptions"
			[ngModel]="tipoCalificacion()"
			(ngModelChange)="tipoCalificacion.set($event)"
			optionLabel="label"
			optionValue="value"
			appendTo="body"
			styleClass="w-full"
			data-info-anchor="admin-salon-config-calificacion-tipo-select"
		/>
	</div>
	<!-- #endregion -->

	<!-- #region Configuración numérica -->
	@if (tipoCalificacion() === 'NUMERICO') {
		<div class="mb-4">
			<label class="block mb-2 font-medium">Nota Mínima Aprobatoria</label>
			<edu-input-number
				[ngModel]="notaMinAprobatoria()"
				(ngModelChange)="notaMinAprobatoria.set($event)"
				[min]="0"
				[max]="20"
				[minFractionDigits]="0"
				[maxFractionDigits]="2"
				mode="decimal"
				styleClass="w-full"
				data-info-anchor="admin-salon-config-calificacion-nota-min-input"
			/>
		</div>
	}
	<!-- #endregion -->

	<!-- #region Configuración literal -->
	@if (tipoCalificacion() === 'LITERAL') {
		<edu-divider />
		<div class="flex justify-between items-center mb-3">
			<span class="font-medium">Literales</span>
			<edu-button
				icon="pi pi-plus"
				label="Agregar"
				[outlined]="true"
				size="small"
				(click)="addLiteral()"
				data-info-anchor="admin-salon-config-calificacion-literal-add-btn"
			/>
		</div>

		@for (literal of literales(); track literal.orden; let i = $index) {
			<div class="literal-row">
				<input
					eduInputText
					[ngModel]="literal.letra"
					(ngModelChange)="updateLiteral(i, 'letra', $event)"
					placeholder="AD"
					class="literal-letra"
					data-info-anchor="admin-salon-config-calificacion-literal-letra-input"
				/>
				<input
					eduInputText
					[ngModel]="literal.descripcion"
					(ngModelChange)="updateLiteral(i, 'descripcion', $event)"
					placeholder="Descripción"
					class="literal-desc"
					data-info-anchor="admin-salon-config-calificacion-literal-desc-input"
				/>
				<edu-input-number
					[ngModel]="literal.notaMinima"
					(ngModelChange)="updateLiteral(i, 'notaMinima', $event)"
					[min]="0"
					[max]="20"
					[minFractionDigits]="0"
					[maxFractionDigits]="2"
					mode="decimal"
					placeholder="Mín"
					styleClass="literal-nota"
				/>
				<span class="literal-nota-separator">–</span>
				<edu-input-number
					[ngModel]="literal.notaMaxima"
					(ngModelChange)="updateLiteral(i, 'notaMaxima', $event)"
					[min]="0"
					[max]="20"
					[minFractionDigits]="0"
					[maxFractionDigits]="2"
					mode="decimal"
					placeholder="Máx"
					styleClass="literal-nota"
				/>
				<edu-checkbox
					[ngModel]="literal.esAprobatoria"
					(ngModelChange)="updateLiteral(i, 'esAprobatoria', $event)"
					[binary]="true"
					data-info-anchor="admin-salon-config-calificacion-literal-aprobatoria-checkbox"
				/>
				<span class="literal-orden">{{ literal.orden }}</span>
				<edu-button
					icon="pi pi-trash"
					[text]="true"
					[rounded]="true"
					size="small"
					severity="danger"
					(click)="removeLiteral(i)"
					[pt]="{
						root: {
							'aria-label': 'Eliminar literal',
						},
					}"
					data-info-anchor="admin-salon-config-calificacion-literal-remove-btn"
				/>
			</div>
		}

		@if (rangoError(); as error) {
			<small class="p-error block mt-2">{{ error }}</small>
		}
	}
	<!-- #endregion -->

	<!-- #region Footer -->
	<ng-template #footer>
		<edu-button
			label="Cancelar"
			[text]="true"
			(click)="onVisibleChange(false)"
			data-info-anchor="admin-salon-config-calificacion-cancel-btn"
		/>
		<edu-button
			label="Guardar"
			icon="pi pi-check"
			[loading]="loading()"
			[disabled]="!isFormValid()"
			(click)="onSave()"
			data-info-anchor="admin-salon-config-calificacion-save-btn"
		/>
	</ng-template>
	<!-- #endregion -->
</edu-dialog>

<div class="filters-bar">
	<div class="search-box">
		<i class="pi pi-search"></i>
		<input
			type="text"
			eduInputText
			placeholder="Buscar por nombre, DNI o correo..."
			[ngModel]="searchTerm()"
			(ngModelChange)="onSearchChange($event)"
			data-info-anchor="admin-auditoria-correos-buscar-input"
		/>
	</div>

	<div class="filter-dropdowns">
		<edu-select
			[options]="tipoOptions"
			[optionLabel]="'label'"
			[optionValue]="'value'"
			[ngModel]="filterTipo()"
			(ngModelChange)="onTipoChange($event)"
			placeholder="Tipo"
			appendTo="body"
			data-info-anchor="admin-auditoria-correos-tipo-select"
		/>
	</div>

	<edu-button
		icon="pi pi-filter-slash"
		[text]="true"
		size="small"
		class="btn-clear"
		eduTooltip="Limpiar filtros"
		eduTooltipPosition="top"
		[disabled]="!hasActiveFilters()"
		(click)="onClear()"
		[pt]="{ root: { 'aria-label': 'Limpiar filtros' } }"
		data-info-anchor="admin-auditoria-correos-limpiar-filtros-btn"
	/>
</div>

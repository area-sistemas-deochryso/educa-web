<!-- #region Template -->
<div class="filters-bar" #filtersEl>
	<div class="search-box">
		<i class="pi pi-search"></i>
		<input
			type="text"
			eduInputText
			placeholder="Buscar por nombre, DNI o correo..."
			[ngModel]="searchTerm()"
			(ngModelChange)="onSearchChange($event)"
			data-info-anchor="admin-users-search-input"
		/>
	</div>

	<div class="filter-dropdowns">
		<edu-select
			[options]="options().estadoOptions"
			[optionLabel]="'label'"
			[optionValue]="'value'"
			[ngModel]="filterEstado()"
			(ngModelChange)="onFilterEstadoChange($event)"
			placeholder="Estado"
			appendTo="body"
			data-info-anchor="admin-users-estado-filter"
		/>

		@if (showSalonFilter()) {
			<edu-select
				[options]="salonOptions()"
				[optionLabel]="'label'"
				[optionValue]="'value'"
				[ngModel]="filterSalonId()"
				(ngModelChange)="onFilterSalonIdChange($event)"
				placeholder="Salón"
				appendTo="body"
				data-info-anchor="admin-users-salon-filter"
			/>
		}

		@if (showContactFilter()) {
			<label class="contact-filter" for="filter-sin-correo-apoderado">
				<edu-checkbox
					inputId="filter-sin-correo-apoderado"
					[binary]="true"
					[ngModel]="filterSinCorreoApoderado()"
					(ngModelChange)="onFilterSinCorreoApoderadoChange($event)"
					data-info-anchor="admin-users-missing-contact-filter"
				/>
				<span>Contacto incompleto</span>
			</label>
		}
	</div>

	@if (hasActiveFilters()) {
		<edu-button
			icon="pi pi-filter-slash"
			[text]="true"
			size="small"
			class="btn-clear"
			eduTooltip="Limpiar filtros"
			eduTooltipPosition="top"
			(click)="onClearFilters()"
			data-info-anchor="admin-users-clear-filters-btn"
			[pt]="{ root: { 'aria-label': 'Limpiar filtros' } }"
		/>
	}
</div>

<app-sticky-filter-bar
	[watch]="filtersEl"
	[searchTerm]="searchTerm()"
	placeholder="Buscar por nombre, DNI o correo..."
	[activeFilters]="activeFilterCount()"
	(searchChange)="onSearchChange($event)"
	(clearFilters)="onClearFilters()"
>
	<edu-select
		[options]="options().estadoOptions"
		[optionLabel]="'label'"
		[optionValue]="'value'"
		[ngModel]="filterEstado()"
		(ngModelChange)="onFilterEstadoChange($event)"
		placeholder="Estado"
		appendTo="body"
	/>
	@if (showSalonFilter()) {
		<edu-select
			[options]="salonOptions()"
			[optionLabel]="'label'"
			[optionValue]="'value'"
			[ngModel]="filterSalonId()"
			(ngModelChange)="onFilterSalonIdChange($event)"
			placeholder="Salón"
			appendTo="body"
		/>
	}
	@if (showContactFilter()) {
		<label class="contact-filter" for="sfb-sin-correo-apoderado">
			<edu-checkbox
				inputId="sfb-sin-correo-apoderado"
				[binary]="true"
				[ngModel]="filterSinCorreoApoderado()"
				(ngModelChange)="onFilterSinCorreoApoderadoChange($event)"
			/>
			<span>Contacto incompleto</span>
		</label>
	}
</app-sticky-filter-bar>
<!-- #endregion -->

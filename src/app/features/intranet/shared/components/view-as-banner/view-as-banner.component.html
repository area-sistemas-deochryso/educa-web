<!-- #region Template -->
@if (isVisible()) {
	<div class="view-as-banner" role="status">
		<div class="view-as-banner__inner">
			<div class="view-as-banner__content">
				<i class="pi pi-eye view-as-banner__icon" aria-hidden="true"></i>
				<span>
					Viendo como: <strong>{{ activeContext()?.nombreCompleto }}</strong>
					({{ activeContext()?.rol }})
				</span>
			</div>
			<div class="view-as-banner__actions">
				<edu-button
					type="button"
					label="Cambiar"
					icon="pi pi-sync"
					[outlined]="true"
					size="small"
					(click)="openPicker()"
				/>
				<edu-button
					type="button"
					label="Salir"
					icon="pi pi-sign-out"
					[text]="true"
					size="small"
					(click)="exit()"
				/>
			</div>
		</div>
	</div>
}

<edu-dialog
	[visible]="pickerOpen()"
	(visibleChange)="onDialogVisibleChange($event)"
	[header]="'Cambiar ' + (activeContext()?.rol ?? '')"
	[modal]="true"
	[style]="{ width: '480px' }"
>
	@if (activeContext(); as context) {
		<app-view-as-picker [rol]="context.rol" (userSelected)="onUserSelected($event)" />
	}
</edu-dialog>
<!-- #endregion -->

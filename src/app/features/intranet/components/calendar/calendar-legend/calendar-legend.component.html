<!-- #region Template -->
<ul class="calendar-legend" aria-label="Leyenda del calendario">
	@for (item of items; track item.kind) {
		<li class="legend-item">
			<app-event-type-marker [kind]="item.kind" />
			<span>{{ item.label }}</span>
		</li>
	}
	<li class="legend-item">
		<span class="today-dot" aria-hidden="true">{{ todayDay }}</span>
		<span>Hoy</span>
	</li>
</ul>
<!-- #endregion -->

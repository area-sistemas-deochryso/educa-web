<!-- #region Template -->
<header class="calendar-header">
	<div class="header-content">
		<i class="pi pi-calendar" aria-hidden="true"></i>
		<div class="header-text">
			<h1>Calendario Académico</h1>
			<p>Año escolar {{ currentYear() }}</p>
		</div>
	</div>

	<div class="header-actions">
		<div class="year-nav" role="group" aria-label="Año">
			<button type="button" class="nav-btn" aria-label="Año anterior" (click)="goToYear.emit(currentYear() - 1)">
				<i class="pi pi-chevron-left" aria-hidden="true"></i>
			</button>
			<strong class="year-label" aria-live="polite">{{ currentYear() }}</strong>
			<button type="button" class="nav-btn" aria-label="Año siguiente" (click)="goToYear.emit(currentYear() + 1)">
				<i class="pi pi-chevron-right" aria-hidden="true"></i>
			</button>
		</div>
		<button type="button" class="today-btn" (click)="goToToday.emit()">
			<i class="pi pi-calendar" aria-hidden="true"></i>
			<span>Hoy</span>
		</button>
	</div>
</header>

<nav class="month-pills" aria-label="Meses del año">
	@for (month of months; track month.short; let i = $index) {
		<button
			type="button"
			class="pill"
			[class.pill--on]="i === currentMonth()"
			[attr.aria-current]="i === currentMonth() ? 'true' : null"
			[attr.aria-label]="countLabel(i)"
			(click)="goToMonth.emit(i)"
		>
			{{ month.short }}
			@if ((monthCounts()[i] ?? 0) > 0) {
				<span class="count">{{ monthCounts()[i] }}</span>
			}
		</button>
	}
</nav>
<!-- #endregion -->

<!-- #region Template -->
<edu-dialog
	[visible]="visible"
	(visibleChange)="onVisibleChange($event)"
	[modal]="true"
	[dismissableMask]="true"
	[draggable]="false"
	[resizable]="false"
	class="attachments-modal"
	[showHeader]="false"
>
	<!-- * Attachments list + upload -->
	<div class="modal-content">
		<h2>Archivos Adjuntos</h2>
		<p class="week-label">{{ weekName }}</p>

		<!-- * Upload section -->
		<div class="upload-section">
			<edu-file-upload
				#fileUpload
				mode="basic"
				[multiple]="true"
				[accept]="uploadAccept"
				[maxFileSize]="uploadMaxBytes"
				[auto]="true"
				[customUpload]="true"
				(uploadHandler)="onFileSelect($event)"
				chooseLabel="Subir Archivos"
				chooseIcon="pi pi-upload"
				[disabled]="vm().uploading"
			></edu-file-upload>

			@if (vm().uploading) {
				<div class="upload-progress">
					<edu-spinner
						class="w-4rem h-4rem"
						strokeWidth="4"
						fill="var(--surface-ground)"
						animationDuration=".5s"
					></edu-spinner>
					<span>Subiendo archivo...</span>
				</div>
			}
		</div>

		<!-- * Files list -->
		<div class="attachments-list">
			@for (attachment of vm().attachments; track attachment.id) {
				<app-file-row
					class="attachment-item"
					[class.unread]="!attachment.isRead"
					data-info-anchor="horario-adjuntos-archivo-abrir"
					[name]="attachment.name"
					[mimeType]="attachment.mimeType"
					[sizeBytes]="attachment.sizeBytes"
					(open)="onDownloadAttachment(attachment)"
				>
					<span actions class="attachment-actions">
						<span class="attachment-date">{{ attachment.date }}</span>
						@if (!attachment.isRead) {
							<span class="unread-badge">Nuevo</span>
						}
						<edu-button
							icon="pi pi-trash"
							[text]="true"
							[rounded]="true"
							size="small"
							severity="danger"
							eduTooltip="Eliminar"
							eduTooltipPosition="top"
							data-info-anchor="horario-adjuntos-archivo-eliminar"
							(click)="onDeleteAttachment(attachment)"
							[pt]="{ root: { 'aria-label': 'Eliminar archivo' } }"
						/>
					</span>
				</app-file-row>
			}
		</div>

		<div class="modal-footer">
			<span class="count-info">{{ vm().totalCount }} archivos</span>
		</div>
	</div>
</edu-dialog>
<!-- #endregion -->

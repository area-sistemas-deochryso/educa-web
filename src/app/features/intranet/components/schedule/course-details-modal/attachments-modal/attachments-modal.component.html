<!-- #region Template -->
<edu-dialog
	[visible]="visible"
	(visibleChange)="onVisibleChange($event)"
	[modal]="true"
	[dismissableMask]="true"
	[draggable]="false"
	[resizable]="false"
	class="attachments-modal"
	[showHeader]="false"
>
	<!-- * Attachments list + upload -->
	<div class="modal-content">
		<h2>Archivos Adjuntos</h2>
		<p class="week-label">{{ weekName }}</p>

		<!-- * Upload section -->
		<div class="upload-section">
			<edu-file-upload
				#fileUpload
				mode="basic"
				[multiple]="true"
				[maxFileSize]="50000000"
				[auto]="true"
				[customUpload]="true"
				(uploadHandler)="onFileSelect($event)"
				chooseLabel="Subir Archivos"
				chooseIcon="pi pi-upload"
				[disabled]="vm().uploading"
			></edu-file-upload>

			@if (vm().uploading) {
				<div class="upload-progress">
					<edu-spinner
						class="w-4rem h-4rem"
						strokeWidth="4"
						fill="var(--surface-ground)"
						animationDuration=".5s"
					></edu-spinner>
					<span>Subiendo archivo...</span>
				</div>
			}
		</div>

		<!-- * Files list -->
		<div class="attachments-list">
			@for (attachment of vm().attachments; track attachment.id) {
				<div class="attachment-item" [class.unread]="!attachment.isRead">
					<div class="attachment-icon">
						<i class="pi" [ngClass]="getIcon(attachment.type)"></i>
					</div>
					<div class="attachment-info">
						<span class="attachment-name">{{ attachment.name }}</span>
						<span class="attachment-meta"
							>{{ attachment.size }} · {{ attachment.date }}</span
						>
					</div>
					<div class="attachment-actions">
						@if (!attachment.isRead) {
							<span class="unread-badge">Nuevo</span>
						}
						<button
							class="action-btn"
							(click)="onDownloadAttachment(attachment)"
							title="Descargar"
							type="button"
							aria-label="Descargar archivo"
						>
							<i class="pi pi-download"></i>
						</button>
						<button
							class="action-btn delete-btn"
							(click)="onDeleteAttachment(attachment)"
							title="Eliminar"
							type="button"
							aria-label="Eliminar archivo"
						>
							<i class="pi pi-trash"></i>
						</button>
					</div>
				</div>
			}
		</div>

		<div class="modal-footer">
			<span class="count-info">{{ vm().totalCount }} archivos</span>
		</div>
	</div>
</edu-dialog>
<!-- #endregion -->
